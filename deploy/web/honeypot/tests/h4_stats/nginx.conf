# Testkonfiguration (hp4a-nginx): bindet die erzeugte map und das location-Snippet ein. Nicht hochladen.
events {}
http {
	map_hash_max_size 4096;
	map_hash_bucket_size 512;
	include /etc/nginx/ipv64/ipv64_bad_useragents.nginx.map;
	server {
		listen 80;
		include /etc/nginx/ipv64/ipv64_attack_paths.nginx.conf;
		if ($ipv64_bad_ua) { return 403; }
		location / { return 200 "ok\n"; }
	}
}
